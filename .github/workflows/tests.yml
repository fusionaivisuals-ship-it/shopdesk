# Runs on every pull request and every push to main (D-23). No Claude API calls: costs $0.
# Gates (SECURITY.md): unit tests, secret scan (G11), build, browser-bundle check (G12).
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: npm audit --omit=dev --audit-level=high
